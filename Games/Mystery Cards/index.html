<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#00198c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Spice it up! Lab" />
  <link rel="manifest" href="../../manifest.webmanifest" />
  <title>Mystery Cards</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="apple-touch-icon" sizes="180x180" href="../../Assets/webicon/app-icon-180.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="../../Assets/webicon/favicon-32.png" />
</head>
<body>
  <main class="app-shell">
    <div class="game-header-bg" aria-hidden="true">
      <img class="game-header-shape" src="../../Assets/Games/game_header.svg" alt="" />
    </div>

    <header class="topbar">
      <button class="icon-button" id="backToGamesButton" type="button" aria-label="Zurück zu Spiele">
        <img src="../../Assets/Games/back.svg" alt="" />
      </button>
      <h1>Mystery Cards</h1>
      <button class="icon-button" id="settingsButton" type="button" aria-label="Einstellungen öffnen">
        <img src="../../Assets/Games/header_gamemenu.svg" alt="" />
      </button>
    </header>

    <section class="game-stage" aria-live="polite">
      <div class="timer-pill" id="timerPill" aria-label="Verbleibende Zeit">
        <span class="timer-dot" aria-hidden="true"></span>
        <strong id="timerText">04:00</strong>
      </div>

      <div class="card-stack" id="cardStack">
        <div class="preview-card" id="previewCard" aria-hidden="true">
          <div class="card-back preview-card-back">
            <div class="prompt-panel is-secret">
              <div class="secret-state">
                <div class="eye-wrap">
                  <img src="../../Assets/Games/Mystery_Cards_Eye.svg" alt="" />
                </div>
                <strong>Gedrückt halten</strong>
                <span>zum Anschauen</span>
              </div>
            </div>
            <div class="result-panel" id="previewPenaltyPanel"></div>
          </div>
        </div>

        <button class="game-card" id="gameCard" type="button" aria-label="Spiel starten">
          <div class="card-inner" id="cardInner">
            <div class="card-face card-front">
              <img src="../../Assets/Games/card_background.png" alt="Mystery Cards" />
            </div>
            <div class="card-face card-back">
              <div class="prompt-panel is-secret" id="promptPanel">
                <div class="secret-state" id="secretState">
                  <div class="eye-wrap">
                    <img id="mysteryEye" src="../../Assets/Games/Mystery_Cards_Eye.svg" alt="" />
                  </div>
                  <strong>Gedrückt halten</strong>
                  <span>zum Anschauen</span>
                </div>
                <div class="revealed-state" id="revealedState" hidden>
                  <span id="promptText"></span>
                </div>
              </div>

              <div class="result-panel" id="penaltyPanel">
                <div class="penalty-row">
                  <span>Falsch<br>geraten</span>
                  <strong id="wrongGuessPenalty"></strong>
                </div>
                <div class="penalty-row">
                  <span>Richtig<br>geraten</span>
                  <strong id="correctGuessPenalty"></strong>
                </div>
                <div class="penalty-row">
                  <span>Ansehen</span>
                  <strong id="revealPenalty"></strong>
                </div>
              </div>
            </div>
          </div>
        </button>
      </div>

      <div class="instruction-row">
        <img src="../../Assets/Games/game_instructions.svg" alt="" />
        <span id="instructionText">Zum Start tippen</span>
      </div>
    </section>
  </main>

  <div class="sheet-scrim" id="sheetScrim" hidden></div>
  <section class="settings-sheet" id="settingsSheet" aria-hidden="true" aria-label="Spiel-Einstellungen">
    <div class="sheet-scroll">
      <div class="setting-card">
        <div class="setting-title-row">
          <img src="../../Assets/Games/Intensity_Spicy.svg" alt="" />
          <h2>Spicy Intensity</h2>
        </div>
        <div class="level-grid" id="spicyLevels"></div>
        <div class="setting-summary" id="spicySummary">
          <strong>Soft</strong>
          <span>Leichtere Mystery Cards</span>
        </div>
      </div>

      <div class="setting-card">
        <div class="setting-title-row">
          <img src="../../Assets/Games/Intensity_Suff.svg" alt="" />
          <h2>Suff Intensity</h2>
        </div>
        <div class="level-grid" id="suffLevels"></div>
        <div class="setting-summary" id="suffSummary">
          <strong>Chillig</strong>
          <span>Bestimmt die Konsequenzen der Karte</span>
        </div>
      </div>

      <div class="setting-card experimental-setting-card">
        <label class="experimental-toggle">
          <span class="toggle-copy">
            <strong>Experimentelle Suff Intensity</strong>
            <span>Alternative Wahrscheinlichkeiten verwenden</span>
          </span>
          <input id="experimentalSuffToggle" type="checkbox" />
          <span class="toggle-control" aria-hidden="true"></span>
        </label>
      </div>

      <div class="setting-card timer-setting-card">
        <div class="setting-title-row timer-title-row">
<h2>Zeit pro Karte</h2>
        </div>
        <div class="timer-stepper" aria-label="Zeit pro Karte einstellen">
          <button id="timerMinus" type="button" aria-label="Eine Minute weniger">−</button>
          <div class="timer-value">
            <strong id="timerSettingValue">4</strong>
            <span>Minuten</span>
          </div>
          <button id="timerPlus" type="button" aria-label="Eine Minute mehr">+</button>
        </div>
        <div class="timer-summary">
          Nach Ablauf verschwindet die Karte automatisch. Die Lösung wird nicht mehr gezeigt.
        </div>
      </div>
    </div>

    <button class="done-button" id="doneButton" type="button">Fertig</button>
  </section>

  <audio id="nextCardSound" preload="auto" src="../../Assets/Games/Mystery_Cards_Next.mp3"></audio>

  <script src="content/spicy-level-1.js"></script>
  <script src="content/spicy-level-2.js"></script>
  <script src="content/spicy-level-3.js"></script>

  <!-- Mystery Cards verwendet absichtlich dieselben Suff-Dateien wie Word Quicky. -->
  <script src="../../Suff_Intensity/suff-normal.js"></script>
  <script src="../../Suff_Intensity/suff-experimental.js"></script>

  <script src="app.js"></script>
</body>
</html>
