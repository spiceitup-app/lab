<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00198C">
  <title>Drehrad</title>
  <style>
    @font-face { font-family:"Red Hat Display"; src:url("../Assets/fonts/RedHatDisplayNormalExtraBold.ttf") format("truetype"); font-style:normal; font-weight:800; font-display:swap; }
    @font-face { font-family:"Red Hat Display"; src:url("../Assets/fonts/RedHatDisplayItalicExtraBold.ttf") format("truetype"); font-style:italic; font-weight:800; font-display:swap; }
    @font-face { font-family:"Red Hat Text"; src:url("../Assets/fonts/RedHatTextNormalRegular.ttf") format("truetype"); font-style:normal; font-weight:400; font-display:swap; }
    @font-face { font-family:"Red Hat Text"; src:url("../Assets/fonts/RedHatTextNormalBold.ttf") format("truetype"); font-style:normal; font-weight:700; font-display:swap; }
    @font-face { font-family:"Red Hat Text"; src:url("../Assets/fonts/RedHatTextItalicRegular.ttf") format("truetype"); font-style:italic; font-weight:400; font-display:swap; }

    :root{
      --text:#080829;
      --blue:#238CF0;
      --green:#14C300;
      --sheet:#EEF6FF;
      --line:#C7CFDA;
      --white:#fff;
      --danger:#E50055;
      --shadow:0 14px 36px rgb(0 0 0 / 12%);
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;}
    body{
      min-height:100dvh;
      overflow-x:hidden;
      background:#0028AD;
      color:#fff;
      font-family:"Red Hat Text",system-ui,sans-serif;
      -webkit-tap-highlight-color:transparent;
    }
    button,input{font:inherit}
    button{-webkit-tap-highlight-color:transparent}

    .app-shell{
      position:relative;
      width:100%;
      min-height:100dvh;
      overflow:hidden;
      background:radial-gradient(60.37% 60.37% at 50% 50%, #005FF3 0%, #0046CB 40%, #0028AD 74.58%, #00198C 100%);
    }
    .app-shell::before{
      content:"";
      position:absolute;
      inset:-20%;
      z-index:0;
      background:radial-gradient(60.37% 60.37% at 50% 50%, #005FF3 0%, #0046CB 40%, #0028AD 74.58%, #00198C 100%);
    }

    .game-header-bg{
      position:absolute;
      z-index:1;
      top:0;
      left:0;
      width:100%;
      height:120px;
      min-height:120px;
      max-height:120px;
      pointer-events:none;
      overflow:hidden;
    }
    .game-header-shape{
      position:absolute;
      top:0;
      left:50%;
      height:120px;
      min-height:120px;
      max-height:120px;
      width:auto;
      max-width:none;
      transform:translateX(-50%);
      display:block;
    }

    .topbar{
      position:relative;
      z-index:3;
      width:100%;
      height:120px;
      min-height:120px;
      max-height:120px;
      padding:max(18px,env(safe-area-inset-top)) 20px 0;
      display:grid;
      grid-template-columns:44px 1fr 44px;
      align-items:center;
      gap:12px;
    }
    .topbar h1{
      margin:0;
      text-align:center;
      font-family:"Red Hat Display",system-ui,sans-serif;
      font-size:24px;
      line-height:1;
      font-style:italic;
      font-weight:800;
      color:#fff;
    }
    .icon-button{
      width:44px;
      height:44px;
      padding:0;
      display:grid;
      place-items:center;
      border-radius:50%;
      border:.5px solid rgb(0 0 0 / 30%);
      background:rgb(0 0 0 / 30%);
      box-shadow:inset 0 0 0 .5px rgb(0 0 0 / 30%);
      color:#fff;
      cursor:pointer;
    }
    .icon-button:active{transform:scale(.97)}
    .icon-button svg{width:25px;height:25px;display:block}
    .icon-button.menu svg{width:28px;height:16px}

    .game-stage{
      position:relative;
      z-index:2;
      min-height:calc(100dvh - 120px);
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:22px 20px max(28px,env(safe-area-inset-bottom));
    }

    .wheel-area{
      width:min(100%,760px);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:18px;
    }
    .wheel-grid{
      width:100%;
      display:grid;
      gap:16px;
      align-items:start;
      justify-items:center;
    }
    .wheel-grid.single{grid-template-columns:1fr}
    .wheel-grid.double{grid-template-columns:1fr 1fr}
    .wheel-card{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
    }
    .wheel-card.single-card{max-width:430px}
    .wheel-card.double-card{max-width:240px}
    .wheel-title{
      margin:0;
      min-height:18px;
      font-family:"Red Hat Text",system-ui,sans-serif;
      font-size:14px;
      font-weight:700;
      color:rgba(255,255,255,.9);
    }

    .wheel-frame{
      width:100%;
      padding:0;
      background:transparent;
      box-shadow:none;
    }
    .wheel-shell{
      position:relative;
      width:100%;
      aspect-ratio:1;
      display:grid;
      place-items:center;
      user-select:none;
    }
    .wheel-rotator{
      position:absolute;
      inset:0;
      transition:transform 1.5s cubic-bezier(.12,.73,.12,1);
      will-change:transform;
    }
    .wheel{
      position:absolute;
      inset:0;
      border-radius:50%;
      overflow:hidden;
      border:6px solid #fff;
      box-shadow:0 10px 28px rgb(0 0 0 / 18%);
      background:#1f4eff;
      cursor:pointer;
      touch-action:manipulation;
    }
    .wheel-card.disabled .wheel{opacity:.72;cursor:default}
    .labels{position:absolute;inset:0;z-index:3;pointer-events:none}
    .wheel-label{
      position:absolute;
      left:50%;
      top:50%;
      height:0;
      transform-origin:0 0;
      display:flex;
      align-items:center;
      justify-content:flex-end;
      color:#fff;
      font-family:"Red Hat Text",system-ui,sans-serif;
      font-weight:700;
      text-align:center;
      text-shadow:0 1px 5px rgba(0,0,0,.35);
      line-height:1.02;
    }
    .wheel-label span{
      display:-webkit-box;
      -webkit-box-orient:vertical;
      overflow:hidden;
      white-space:normal;
      word-break:break-word;
      overflow-wrap:anywhere;
      max-width:100%;
    }
    .wheel-center{
      position:absolute;
      z-index:4;
      width:8%;
      aspect-ratio:1;
      border-radius:50%;
      background:#fff;
      border:2px solid rgb(0 0 0 / 6%);
      box-shadow:0 3px 8px rgba(0,0,0,.18);
      pointer-events:none;
    }
    .pointer{
      position:absolute;
      right:-18px;
      top:50%;
      transform:translateY(-50%);
      width:48px;
      height:48px;
      z-index:5;
      pointer-events:none;
      filter:drop-shadow(0 5px 9px rgba(0,0,0,.22));
    }

    .hint{
      margin:0;
      min-height:26px;
      color:#fff;
      font-family:"Red Hat Text",system-ui,sans-serif;
      font-size:18px;
      line-height:1.2;
      font-style:italic;
      text-align:center;
    }

    .result-panel{
      width:min(100%,520px);
      min-height:106px;
      border-radius:24px;
      border:0;
      background:#fff;
      overflow:hidden;
      cursor:pointer;
      transition:transform .18s ease;
      color:#111827;
      box-shadow:0 10px 28px rgb(0 0 0 / 12%);
    }
    .result-panel:active{transform:scale(.99)}
    .result-single,.result-double{width:100%;min-height:106px;height:100%}
    .result-single{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:5px;
      padding:14px 18px;
    }
    .result-double{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch}
    .result-part{
      min-height:106px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:12px 9px;
      text-align:center;
      color:#fff;
    }
    .result-plus{
      min-width:38px;
      display:grid;
      place-items:center;
      background:#fff;
      color:#111827;
      font-size:24px;
      font-weight:700;
    }
    .result-overline{
      font-size:14px;
      line-height:1.1;
      font-weight:400;
      margin-bottom:5px;
    }
    .result-text{
      font-size:22px;
      line-height:1.08;
      font-weight:700;
      overflow-wrap:anywhere;
      text-align:center;
    }

    .sheet-scrim{
      position:fixed;
      inset:0;
      z-index:20;
      background:rgb(0 0 0 / 22%);
      opacity:0;
      pointer-events:none;
      transition:opacity 220ms ease;
    }
    .sheet-scrim.open{opacity:1;pointer-events:auto}
    .overlay{
      position:fixed;
      z-index:21;
      left:0;
      right:0;
      bottom:0;
      height:min(88dvh,760px);
      padding:18px 16px max(16px,env(safe-area-inset-bottom));
      background:var(--sheet);
      border-radius:28px 28px 0 0;
      color:var(--text);
      transform:translateY(105%);
      transition:transform 420ms cubic-bezier(.18,.75,.18,1);
      display:grid;
      grid-template-rows:minmax(0,1fr) auto;
      gap:14px;
      overflow:hidden;
    }
    .overlay.open{transform:translateY(0)}
    .modal{
      display:contents;
    }
    .sheet-scroll{overflow-y:auto;padding:2px 6px 4px}
    .modal-header{
      background:#fff;
      border:1px solid var(--line);
      border-radius:24px;
      padding:16px;
      margin-bottom:16px;
    }
    .modal-header h2{
      margin:0 0 6px;
      font-family:"Red Hat Display",system-ui,sans-serif;
      font-size:20px;
      line-height:1.05;
      font-weight:800;
    }
    .modal-header p,.settings-sub,.small-note{
      margin:0;
      color:#626B7B;
      font-size:16px;
      line-height:1.25;
      font-weight:400;
    }
    .modal-content{display:block}
    .settings-block{
      background:#fff;
      border:1px solid var(--line);
      border-radius:24px;
      padding:16px;
      margin-bottom:16px;
    }
    .settings-block h3{
      margin:0 0 6px;
      font-family:"Red Hat Display",system-ui,sans-serif;
      font-size:20px;
      line-height:1.05;
      font-weight:800;
    }
    .settings-sub{margin-bottom:12px}
    .switch-row{
      min-height:64px;
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      align-items:center;
      gap:16px;
      cursor:pointer;
      user-select:none;
    }
    .switch-copy{display:flex;flex-direction:column;min-width:0}
    .switch-copy strong{
      font-family:"Red Hat Display",system-ui,sans-serif;
      font-size:20px;
      line-height:1.05;
      font-weight:800;
      color:#111827;
    }
    .switch-copy span{
      margin-top:6px;
      font-family:"Red Hat Text",system-ui,sans-serif;
      font-size:16px;
      line-height:1.2;
      font-weight:400;
      color:#626B7B;
    }
    .switch-row input{position:absolute;opacity:0;pointer-events:none}
    .switch-control{
      position:relative;
      width:52px;
      height:32px;
      border-radius:999px;
      background:#C9D0DA;
      box-shadow:inset 0 0 0 1px rgb(0 0 0 / 7%);
      transition:background 180ms ease;
    }
    .switch-control::after{
      content:"";
      position:absolute;
      top:3px;
      left:3px;
      width:26px;
      height:26px;
      border-radius:50%;
      background:#fff;
      box-shadow:0 2px 7px rgb(0 0 0 / 20%);
      transition:transform 180ms ease;
    }
    .switch-row input:checked + .switch-control{background:#14C300}
    .switch-row input:checked + .switch-control::after{transform:translateX(20px)}
    .fields-group{display:flex;flex-direction:column;gap:10px}
    .field-row{
      display:grid;
      grid-template-columns:28px 1fr 40px;
      align-items:center;
      gap:10px;
    }
    .field-number{font-size:16px;font-weight:700;color:#626B7B;text-align:center}
    .entry-input{
      width:100%;
      min-height:48px;
      border-radius:14px;
      border:1px solid #D1D8E2;
      background:#F7FAFD;
      color:var(--text);
      outline:0;
      padding:0 14px;
      font-size:16px;
    }
    .entry-input::placeholder{color:#A2AABA}
    .entry-input:focus{border-color:#111827;box-shadow:0 0 0 3px rgb(35 140 240 / 12%)}
    .delete-btn{
      width:40px;
      height:40px;
      border:1px solid #D1D8E2;
      border-radius:12px;
      background:#fff;
      color:#E50055;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      display:grid;
      place-items:center;
    }
    .delete-btn:disabled{opacity:.28;cursor:default}
    .error{min-height:18px;margin-top:7px;color:var(--danger);font-size:14px;font-weight:700}
    .modal-actions{
      display:grid;
      grid-template-columns:1fr;
      justify-items:center;
      padding:0;
      background:transparent;
    }
    .modal-actions .done-button{
      width:min(184px,56vw);
      height:56px;
      border:0;
      border-radius:18px;
      background:#14C300;
      color:#fff;
      font-family:"Red Hat Text",system-ui,sans-serif;
      font-size:18px;
      font-weight:700;
      box-shadow:0 8px 22px rgb(0 0 0 / 16%);
      cursor:pointer;
    }

    .result-sheet{
      padding:20px 16px max(18px,env(safe-area-inset-bottom));
      gap:16px;
    }
    .result-modal-body{
      padding:0;
      display:flex;
      flex-direction:column;
      gap:14px;
      overflow-y:auto;
    }
    .result-sheet-title{
      margin:0;
      padding:0 2px;
      font-family:"Red Hat Display",system-ui,sans-serif;
      font-size:22px;
      line-height:1.1;
      font-weight:800;
      color:#111827;
    }
    .result-preview{
      border:0;
      outline:0;
      border-radius:24px;
      overflow:hidden;
      background:transparent;
      box-shadow:none;
    }
    .result-preview .result-single,
    .result-preview .result-double{
      min-height:104px;
    }
    .result-actions{
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .action-btn{
      width:100%;
      min-height:52px;
      padding:0 16px;
      border:1px solid #D9DEE7;
      border-radius:16px;
      background:#F5F7FA;
      color:#111827;
      font-family:"Red Hat Text",system-ui,sans-serif;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      box-shadow:none;
    }
    .action-btn:active{transform:scale(.99)}
    .action-btn.strong{
      background:#F5F7FA;
      color:#111827;
      border-color:#D9DEE7;
    }
    .result-footer{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      padding:0;
    }
    .result-footer-btn{
      min-height:54px;
      border:0;
      border-radius:17px;
      font-family:"Red Hat Text",system-ui,sans-serif;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
    }
    .result-close-btn{
      background:#EEF1F5;
      color:#111827;
    }
    .result-remove-all-btn{
      background:#E9003F;
      color:#fff;
    }
    .result-footer-btn:active{transform:scale(.99)}
    .hidden{display:none !important}

    @media (min-width:700px){
      .topbar{
        width:min(520px,calc(100vw - 48px));
        margin:0 auto;
        padding-left:0;
        padding-right:0;
        gap:20px;
      }
      .game-stage{padding-top:34px}
      .overlay{
        left:50%;
        right:auto;
        width:min(520px,calc(100vw - 40px));
        transform:translate(-50%,105%);
      }
      .overlay.open{transform:translate(-50%,0)}
      .wheel-area{gap:22px}
      .wheel-card.single-card{max-width:500px}
      .wheel-card.double-card{max-width:320px}
      .wheel-grid.double{gap:28px}
    }
    @media (max-width:420px){
      .game-stage{padding-left:16px;padding-right:16px}
      .wheel-grid.double{gap:10px}
      .wheel-frame{padding:10px;border-radius:32px}
      .pointer{width:42px;height:42px;right:-15px}
      .result-text{font-size:20px}
    }
    @media (max-height:700px){
      .game-stage{padding-top:10px}
      .wheel-card.single-card{max-width:340px}
      .wheel-area{gap:12px}
      .hint{font-size:16px}
    }
    @media (prefers-reduced-motion:reduce){
      .wheel-rotator{transition-duration:.01ms !important}
      .overlay{transition-duration:.01ms !important}
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <div class="game-header-bg" aria-hidden="true">
      <img class="game-header-shape" src="../Assets/game_header.svg" alt="">
    </div>

    <header class="topbar">
      <button class="icon-button" id="backToGamesButton" type="button" aria-label="Zurück zu Spiele">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h1>Drehrad</h1>
      <button class="icon-button menu" id="settingsBtn" aria-label="Einstellungen öffnen" title="Einstellungen">
        <svg viewBox="0 0 28 10" fill="currentColor" aria-hidden="true"><circle cx="4" cy="5" r="3"/><circle cx="14" cy="5" r="3"/><circle cx="24" cy="5" r="3"/></svg>
      </button>
    </header>

    <section class="game-stage">
      <section class="wheel-area">
        <div class="wheel-grid single" id="wheelGrid">
          <section class="wheel-card single-card" id="card1">
            <p class="wheel-title" id="title1"></p>
            <div class="wheel-frame">
              <div class="wheel-shell">
                <div class="wheel-rotator" id="rotator1">
                  <div class="wheel" id="wheel1" role="button" tabindex="0" aria-label="Rad 1 drehen"></div>
                  <div class="labels" id="labels1" aria-hidden="true"></div>
                </div>
                <div class="wheel-center" aria-hidden="true"></div>
                <svg class="pointer" viewBox="0 0 64 64" aria-hidden="true">
                  <path d="M14 32 Q14 28.5 17.2 26.8 L47.2 10.4 Q50.8 8.4 53.3 11.3 Q55.5 13.9 55.5 17.6 L55.5 46.4 Q55.5 50.1 53.3 52.7 Q50.8 55.6 47.2 53.6 L17.2 37.2 Q14 35.5 14 32 Z" fill="#ffffff"></path>
                </svg>
              </div>
            </div>
          </section>

          <section class="wheel-card double-card hidden" id="card2">
            <p class="wheel-title" id="title2"></p>
            <div class="wheel-frame">
              <div class="wheel-shell">
                <div class="wheel-rotator" id="rotator2">
                  <div class="wheel" id="wheel2" role="button" tabindex="0" aria-label="Rad 2 drehen"></div>
                  <div class="labels" id="labels2" aria-hidden="true"></div>
                </div>
                <div class="wheel-center" aria-hidden="true"></div>
                <svg class="pointer" viewBox="0 0 64 64" aria-hidden="true">
                  <path d="M14 32 Q14 28.5 17.2 26.8 L47.2 10.4 Q50.8 8.4 53.3 11.3 Q55.5 13.9 55.5 17.6 L55.5 46.4 Q55.5 50.1 53.3 52.7 Q50.8 55.6 47.2 53.6 L17.2 37.2 Q14 35.5 14 32 Z" fill="#ffffff"></path>
                </svg>
              </div>
            </div>
          </section>
        </div>

        <p class="hint" id="hint">Tippe auf das Rad, um zu drehen.</p>

        <section class="result-panel" id="resultPanel" aria-live="polite" role="button" tabindex="0">
          <div id="resultContent" class="result-single">
            <div class="result-overline">Ergebnis</div>
            <div class="result-text">Noch nicht gedreht</div>
          </div>
        </section>
      </section>
    </section>
  </main>

  <div class="sheet-scrim" id="settingsScrim"></div>
  <div class="overlay" id="settingsOverlay" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-label="Einstellungen">
      <div class="sheet-scroll">
<div class="modal-content">
          <section class="settings-block">
            <label class="switch-row" for="secondWheelToggle">
              <span class="switch-copy">
                <strong>Zweites Rad</strong>
                <span>Optional ein zweites Rad verwenden</span>
              </span>
              <input id="secondWheelToggle" type="checkbox" />
              <span class="switch-control" aria-hidden="true"></span>
            </label>
          </section>

          <section class="settings-block">
            <h3>Rad 1</h3>
            <p class="settings-sub">Mindestens 2 Einträge zum Drehen, maximal 20.</p>
            <div class="fields-group" id="fields1"></div>
            <div class="error" id="error1"></div>
          </section>

          <section class="settings-block hidden" id="block2">
            <h3>Rad 2</h3>
            <p class="settings-sub">Eigene Einträge nur für das zweite Rad.</p>
            <div class="fields-group" id="fields2"></div>
            <div class="error" id="error2"></div>
          </section>
        </div>
      </div>

      <div class="modal-actions single-action">
        <button class="done-button" id="saveSettingsBtn" type="button">Fertig</button>
      </div>
    </section>
  </div>

  <div class="sheet-scrim" id="resultScrim"></div>
  <div class="overlay" id="resultOverlay" aria-hidden="true">
    <section class="modal result-sheet" role="dialog" aria-modal="true" aria-labelledby="resultModalTitle">
      <div class="result-modal-body">
        <h2 class="result-sheet-title" id="resultModalTitle">Ergebnis</h2>
        <div class="result-preview" id="resultPreview"></div>
        <div class="result-actions" id="resultActions"></div>
      </div>

      <div class="result-footer">
        <button class="result-footer-btn result-close-btn" id="closeResultBtn" type="button">Schließen</button>
        <button class="result-footer-btn result-remove-all-btn" id="removeBothBtn" type="button">Beide entfernen</button>
      </div>
    </section>
  </div>

  <script>

    const MAX_ENTRIES = 20;
    const SPIN_MS = 1500;

    const wheelGrid = document.getElementById("wheelGrid");
    const card1 = document.getElementById("card1");
    const card2 = document.getElementById("card2");
    const title1 = document.getElementById("title1");
    const title2 = document.getElementById("title2");
    const wheel1 = document.getElementById("wheel1");
    const wheel2 = document.getElementById("wheel2");
    const rotator1 = document.getElementById("rotator1");
    const rotator2 = document.getElementById("rotator2");
    const labels1 = document.getElementById("labels1");
    const labels2 = document.getElementById("labels2");
    const hint = document.getElementById("hint");
    const resultPanel = document.getElementById("resultPanel");
    const resultContent = document.getElementById("resultContent");
    const settingsBtn = document.getElementById("settingsBtn");

    const settingsOverlay = document.getElementById("settingsOverlay");
    const settingsScrim = document.getElementById("settingsScrim");
    const resultOverlay = document.getElementById("resultOverlay");
    const resultScrim = document.getElementById("resultScrim");
    const backToGamesButton = document.getElementById("backToGamesButton");
    const secondWheelToggle = document.getElementById("secondWheelToggle");
    const fields1 = document.getElementById("fields1");
    const fields2 = document.getElementById("fields2");
    const error1 = document.getElementById("error1");
    const error2 = document.getElementById("error2");
    const block2 = document.getElementById("block2");
    const saveSettingsBtn = document.getElementById("saveSettingsBtn");
    const cancelSettingsBtn = document.getElementById("cancelSettingsBtn");
    const resultPreview = document.getElementById("resultPreview");
    const resultNote = document.getElementById("resultNote");
    const resultActions = document.getElementById("resultActions");
    const removeBothBtn = document.getElementById("removeBothBtn");
    const closeResultBtn = document.getElementById("closeResultBtn");

    const palette = [
      "#FF1744", "#FF6D00", "#FFC400", "#76FF03", "#00E676",
      "#00E5FF", "#00B0FF", "#2979FF", "#651FFF", "#D500F9",
      "#FF4081", "#F50057", "#00C853", "#64DD17", "#FFD600",
      "#FF9100", "#FF3D00", "#3D5AFE", "#304FFE", "#AA00FF"
    ];

    function defaultState() {
      return {
        wheel1Entries: ["Eintrag 1", "Eintrag 2"],
        wheel2Entries: ["Option 1", "Option 2"],
        secondWheelEnabled: false
      };
    }

    function sanitizeEntries(items) {
      return (items || []).map(v => String(v || "").trim()).filter(Boolean).slice(0, MAX_ENTRIES);
    }

    function loadState() {
      try {
        const raw = JSON.parse(localStorage.getItem("dualWheelState"));
        if (!raw || typeof raw !== "object") return defaultState();
        return {
          wheel1Entries: sanitizeEntries(raw.wheel1Entries).length ? sanitizeEntries(raw.wheel1Entries) : defaultState().wheel1Entries,
          wheel2Entries: sanitizeEntries(raw.wheel2Entries).length ? sanitizeEntries(raw.wheel2Entries) : defaultState().wheel2Entries,
          secondWheelEnabled: Boolean(raw.secondWheelEnabled)
        };
      } catch (e) {
        return defaultState();
      }
    }

    let state = loadState();
    let draftState = null;
    let spinning = false;
    let rotation1 = 0;
    let rotation2 = 0;
    let lastResult = null;

    function saveState() {
      localStorage.setItem("dualWheelState", JSON.stringify(state));
    }

    function escapeHtml(value) {
      return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function randomIndex(max) {
      if (window.crypto && window.crypto.getRandomValues) {
        const range = 0x100000000;
        const limit = range - (range % max);
        const arr = new Uint32Array(1);
        do { crypto.getRandomValues(arr); } while (arr[0] >= limit);
        return arr[0] % max;
      }
      return Math.floor(Math.random() * max);
    }

    function getVisibleRows(values) {
      const trimmed = values.map(v => String(v || "").trim());
      let highest = -1;
      trimmed.forEach((v, i) => { if (v) highest = i; });
      return Math.min(MAX_ENTRIES, Math.max(2, highest + 2));
    }

    function getTextSpec(count, textLength, wheelSize) {
      const scale = wheelSize / 320;
      let base, width, radius, lines;

      if (count <= 2) { base = 24; width = 34; radius = 21; lines = 2; }
      else if (count <= 4) { base = 18; width = 34; radius = 25; lines = 2; }
      else if (count <= 6) { base = 15; width = 34; radius = 28; lines = 2; }
      else if (count <= 10) { base = 12; width = 35; radius = 31; lines = 2; }
      else { base = 10.5; width = 36; radius = 33; lines = 2; }

      if (textLength <= 6) base += 4;
      else if (textLength <= 10) base += 2.5;
      else if (textLength <= 15) base += 1;
      else if (textLength >= 24) base -= 1.2;

      const size = Math.max(9, Math.min(26, base * scale));
      return { size, width, radius, lines };
    }

    function setWheelVisual(wheelEl, labelsEl, entries) {
      const count = entries.length || 1;
      const slice = 360 / count;
      const stops = entries.map((_, i) => {
        const start = i * slice;
        const end = (i + 1) * slice;
        return `${palette[i % palette.length]} ${start}deg ${end}deg`;
      }).join(", ");

      wheelEl.style.background = entries.length ? `conic-gradient(from 0deg, ${stops})` : "rgba(255,255,255,.18)";
      labelsEl.innerHTML = "";

      const wheelSize = wheelEl.getBoundingClientRect().width || 320;

      entries.forEach((text, i) => {
        const mid = (i + 0.5) * slice;
        const spec = getTextSpec(count, text.length, wheelSize);

        const label = document.createElement("div");
        label.className = "wheel-label";
        label.style.width = spec.width + "%";
        label.style.fontSize = spec.size + "px";
        label.style.transform = `rotate(${mid - 90}deg) translateX(${spec.radius}%)`;

        const span = document.createElement("span");
        span.textContent = text;
        span.style.webkitLineClamp = String(spec.lines);

        label.appendChild(span);
        labelsEl.appendChild(label);
      });
    }

    function canSpin() {
      if (state.wheel1Entries.length < 2) return false;
      if (state.secondWheelEnabled && state.wheel2Entries.length < 2) return false;
      return true;
    }

    function updateHint() {
      if (spinning) hint.textContent = "Die Räder drehen sich …";
      else if (canSpin()) {
        hint.textContent = state.secondWheelEnabled ? "Tippe auf ein Rad, beide drehen gleichzeitig." : "Tippe auf das Rad, um zu drehen.";
      } else if (state.secondWheelEnabled) {
        hint.textContent = "Für beide Räder werden jeweils mindestens 2 Einträge benötigt.";
      } else {
        hint.textContent = "Für das Rad werden mindestens 2 Einträge benötigt.";
      }
    }

    function renderWheels() {
      const dual = state.secondWheelEnabled;
      wheelGrid.classList.toggle("single", !dual);
      wheelGrid.classList.toggle("double", dual);
      card1.classList.toggle("single-card", !dual);
      card1.classList.toggle("double-card", dual);
      card2.classList.toggle("hidden", !dual);
      card2.classList.toggle("double-card", dual);
      title1.textContent = dual ? "Rad 1" : "";
      title2.textContent = dual ? "Rad 2" : "";
      card1.classList.toggle("disabled", state.wheel1Entries.length < 2);
      card2.classList.toggle("disabled", dual && state.wheel2Entries.length < 2);

      setWheelVisual(wheel1, labels1, state.wheel1Entries);
      if (dual) setWheelVisual(wheel2, labels2, state.wheel2Entries);

      updateHint();
    }

    function renderResultPanel() {
      if (!lastResult) {
        resultContent.className = "result-single";
        resultContent.style.background = "transparent";
        resultContent.style.color = "#111827";
        resultContent.innerHTML = `<div class="result-overline">Ergebnis</div><div class="result-text">Noch nicht gedreht</div>`;
        return;
      }

      if (!state.secondWheelEnabled || !lastResult.wheel2) {
        resultContent.className = "result-single";
        resultContent.style.background = lastResult.wheel1.color;
        resultContent.style.color = "#fff";
        resultContent.innerHTML = `<div class="result-overline">Ergebnis</div><div class="result-text">${escapeHtml(lastResult.wheel1.text)}</div>`;
      } else {
        resultContent.className = "result-double";
        resultContent.style.background = "transparent";
        resultContent.innerHTML = `
          <div class="result-part" style="background:${lastResult.wheel1.color}">
            <div class="result-overline">Rad 1</div>
            <div class="result-text">${escapeHtml(lastResult.wheel1.text)}</div>
          </div>
          <div class="result-plus">+</div>
          <div class="result-part" style="background:${lastResult.wheel2.color}">
            <div class="result-overline">Rad 2</div>
            <div class="result-text">${escapeHtml(lastResult.wheel2.text)}</div>
          </div>
        `;
      }
    }

    function spinAll() {
      if (spinning || !canSpin()) return;

      spinning = true;
      updateHint();

      const idx1 = randomIndex(state.wheel1Entries.length);
      const slice1 = 360 / state.wheel1Entries.length;
      const center1 = idx1 * slice1 + slice1 / 2;
      const desired1 = (90 - center1 + 360) % 360;
      const normalized1 = ((rotation1 % 360) + 360) % 360;
      const delta1 = (desired1 - normalized1 + 360) % 360;
      rotation1 += (5 + randomIndex(3)) * 360 + delta1;
      rotator1.style.transform = `rotate(${rotation1}deg)`;

      let result2 = null;
      if (state.secondWheelEnabled) {
        const idx2 = randomIndex(state.wheel2Entries.length);
        const slice2 = 360 / state.wheel2Entries.length;
        const center2 = idx2 * slice2 + slice2 / 2;
        const desired2 = (90 - center2 + 360) % 360;
        const normalized2 = ((rotation2 % 360) + 360) % 360;
        const delta2 = (desired2 - normalized2 + 360) % 360;
        rotation2 += (5 + randomIndex(3)) * 360 + delta2;
        rotator2.style.transform = `rotate(${rotation2}deg)`;

        result2 = { index: idx2, text: state.wheel2Entries[idx2], color: palette[idx2 % palette.length] };
      }

      const result1 = { index: idx1, text: state.wheel1Entries[idx1], color: palette[idx1 % palette.length] };

      window.setTimeout(() => {
        lastResult = { wheel1: result1, wheel2: result2 };
        spinning = false;
        renderResultPanel();
        updateHint();
        if (navigator.vibrate) navigator.vibrate(35);
      }, SPIN_MS);
    }

    function clearErrors() {
      error1.textContent = "";
      error2.textContent = "";
    }

    function syncSecondToggle() {
      secondWheelToggle.checked = draftState.secondWheelEnabled;
      block2.classList.toggle("hidden", !draftState.secondWheelEnabled);
    }

    function renderFields(which) {
      const container = which === 1 ? fields1 : fields2;
      const key = which === 1 ? "wheel1Entries" : "wheel2Entries";
      const values = draftState[key].slice();
      const visibleRows = getVisibleRows(values);

      container.innerHTML = "";

      for (let i = 0; i < visibleRows; i++) {
        const row = document.createElement("div");
        row.className = "field-row";

        const num = document.createElement("div");
        num.className = "field-number";
        num.textContent = i + 1;

        const input = document.createElement("input");
        input.className = "entry-input";
        input.type = "text";
        input.maxLength = 60;
        input.placeholder = `Eintrag ${i + 1}`;
        input.value = values[i] || "";

        input.addEventListener("input", () => {
          draftState[key][i] = input.value;
          renderFields(which);
          const again = container.querySelectorAll("input")[i];
          if (again) {
            again.focus();
            const len = again.value.length;
            try { again.setSelectionRange(len, len); } catch (e) {}
          }
          clearErrors();
        });

        const del = document.createElement("button");
        del.type = "button";
        del.className = "delete-btn";
        del.textContent = "✕";
        del.title = "Eintrag löschen";
        del.disabled = !(values[i] || "").trim();
        del.addEventListener("click", () => {
          draftState[key].splice(i, 1);
          renderFields(which);
          clearErrors();
        });

        row.appendChild(num);
        row.appendChild(input);
        row.appendChild(del);
        container.appendChild(row);
      }
    }

    function openSettings() {
      draftState = {
        wheel1Entries: state.wheel1Entries.slice(),
        wheel2Entries: state.wheel2Entries.slice(),
        secondWheelEnabled: state.secondWheelEnabled
      };

      clearErrors();
      renderFields(1);
      renderFields(2);
      syncSecondToggle();

      settingsOverlay.classList.add("open");
      settingsScrim.classList.add("open");
      settingsOverlay.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";

      setTimeout(() => {
        const first = fields1.querySelector("input");
        if (first) first.focus();
      }, 40);
    }

    function closeSettings() {
      settingsOverlay.classList.remove("open");
      settingsScrim.classList.remove("open");
      settingsOverlay.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      settingsBtn.focus();
    }

    function saveSettings() {
      clearErrors();
      const entries1 = sanitizeEntries(draftState.wheel1Entries);
      const entries2 = sanitizeEntries(draftState.wheel2Entries);
      let ok = true;

      if (entries1.length < 2) {
        error1.textContent = "Bitte für Rad 1 mindestens zwei Einträge ausfüllen.";
        ok = false;
      }

      if (draftState.secondWheelEnabled && entries2.length < 2) {
        error2.textContent = "Bitte für Rad 2 mindestens zwei Einträge ausfüllen.";
        ok = false;
      }

      if (!ok) return;

      state.wheel1Entries = entries1;
      state.wheel2Entries = entries2.length ? entries2 : ["Option 1", "Option 2"];
      state.secondWheelEnabled = draftState.secondWheelEnabled;

      saveState();
      lastResult = null;
      renderWheels();
      renderResultPanel();
      closeSettings();
    }

    function openResultModal() {
      if (!lastResult) return;

      if (!state.secondWheelEnabled || !lastResult.wheel2) {
        resultPreview.innerHTML = `
          <div class="result-single" style="background:${lastResult.wheel1.color}">
            <div class="result-overline">Ergebnis</div>
            <div class="result-text">${escapeHtml(lastResult.wheel1.text)}</div>
          </div>
        `;
        resultActions.innerHTML = `<button class="action-btn strong" id="removeWheel1Btn" type="button">Aus Rad 1 entfernen</button>`;
        removeBothBtn.classList.add("hidden");
      } else {
        resultPreview.innerHTML = `
          <div class="result-double">
            <div class="result-part" style="background:${lastResult.wheel1.color}">
              <div class="result-overline">Rad 1</div>
              <div class="result-text">${escapeHtml(lastResult.wheel1.text)}</div>
            </div>
            <div class="result-plus">+</div>
            <div class="result-part" style="background:${lastResult.wheel2.color}">
              <div class="result-overline">Rad 2</div>
              <div class="result-text">${escapeHtml(lastResult.wheel2.text)}</div>
            </div>
          </div>
        `;
        resultActions.innerHTML = `
          <button class="action-btn" id="removeWheel1Btn" type="button">Aus Rad 1 entfernen</button>
          <button class="action-btn" id="removeWheel2Btn" type="button">Aus Rad 2 entfernen</button>
        `;
        removeBothBtn.classList.remove("hidden");
      }

      const btn1 = document.getElementById("removeWheel1Btn");
      const btn2 = document.getElementById("removeWheel2Btn");
      if (btn1) btn1.addEventListener("click", () => removeDrawnEntry(1));
      if (btn2) btn2.addEventListener("click", () => removeDrawnEntry(2));

      resultOverlay.classList.add("open");
      resultScrim.classList.add("open");
      resultOverlay.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeResultModal() {
      resultOverlay.classList.remove("open");
      resultScrim.classList.remove("open");
      resultOverlay.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      resultPanel.focus();
    }

    function removeDrawnEntry(which) {
      if (!lastResult) return;

      if (which === 1 && lastResult.wheel1) {
        const idx = state.wheel1Entries.indexOf(lastResult.wheel1.text);
        if (idx > -1) state.wheel1Entries.splice(idx, 1);
      }

      if (which === 2 && lastResult.wheel2) {
        const idx = state.wheel2Entries.indexOf(lastResult.wheel2.text);
        if (idx > -1) state.wheel2Entries.splice(idx, 1);
      }

      finishRemoval();
    }

    function removeBothDrawn() {
      if (!lastResult) return;

      if (lastResult.wheel1) {
        const idx1 = state.wheel1Entries.indexOf(lastResult.wheel1.text);
        if (idx1 > -1) state.wheel1Entries.splice(idx1, 1);
      }

      if (lastResult.wheel2) {
        const idx2 = state.wheel2Entries.indexOf(lastResult.wheel2.text);
        if (idx2 > -1) state.wheel2Entries.splice(idx2, 1);
      }

      finishRemoval();
    }

    function finishRemoval() {
      saveState();
      lastResult = null;
      renderWheels();
      renderResultPanel();
      closeResultModal();
    }

    secondWheelToggle.addEventListener("change", () => {
      draftState.secondWheelEnabled = secondWheelToggle.checked;
      syncSecondToggle();
      clearErrors();
    });

    settingsBtn.addEventListener("click", openSettings);
    saveSettingsBtn.addEventListener("click", saveSettings);
    cancelSettingsBtn?.addEventListener("click", closeSettings);

    settingsOverlay.addEventListener("click", (event) => {
      if (event.target === settingsOverlay) closeSettings();
    });

    closeResultBtn.addEventListener("click", closeResultModal);
    removeBothBtn.addEventListener("click", removeBothDrawn);

    resultOverlay.addEventListener("click", (event) => {
      if (event.target === resultOverlay) closeResultModal();
    });

    [wheel1, wheel2].forEach((wheelEl) => {
      wheelEl.addEventListener("click", spinAll);
      wheelEl.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          spinAll();
        }
      });
    });

    resultPanel.addEventListener("click", openResultModal);
    resultPanel.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openResultModal();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        if (settingsOverlay.classList.contains("open")) closeSettings();
        if (resultOverlay.classList.contains("open")) closeResultModal();
      }
    });

    window.addEventListener("resize", () => {
      renderWheels();
      renderResultPanel();
    });



    settingsScrim.addEventListener("click", closeSettings);
    resultScrim.addEventListener("click", closeResultModal);

    backToGamesButton.addEventListener("click", () => {
      const confirmed = window.confirm("Möchtest du das Drehrad wirklich verlassen und zurück zu Spiele?");
      if (!confirmed) return;

      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type:"drehrad:exit" }, window.location.origin);
        return;
      }

      window.location.href = "../index.html";
    });


    renderWheels();
    renderResultPanel();
  
  </script>
</body>
</html>
