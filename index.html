<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#00198c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Spice it up! Lab" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Spiele</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="apple-touch-icon" sizes="180x180" href="Assets/webicon/app-icon-180.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="Assets/webicon/favicon-32.png" />
</head>
<body>
  <main class="app-shell">
    <div class="game-header-bg" aria-hidden="true">
      <img class="game-header-shape" src="Assets/Games/game_header.svg" alt="" />
    </div>

    <header class="topbar">
      <span class="topbar-spacer" aria-hidden="true"></span>
      <h1>Spiele</h1>
      <span class="topbar-spacer" aria-hidden="true"></span>
    </header>

    <section class="games-stage" aria-label="Spiele auswählen">
      <div class="games-grid">
        <!--
          Neues Spiel hinzufügen:
          1. Diesen <a class="game-tile">-Block kopieren.
          2. href, Bild, Titel und aria-label ändern.
          3. Maximal zwei Kacheln stehen nebeneinander.
          Ist nur eine Kachel vorhanden, füllt sie automatisch die ganze Breite.
        -->
        <a class="game-tile" href="Games/Word%20Quicky/index.html" id="wordQuickyTile" aria-label="Word Quicky öffnen">
          <div class="game-logo-wrap">
            <img class="game-logo" src="Assets/Logo/Word_Quicky_Logo.png" alt="" />
          </div>
          <span class="game-name">Word Quicky</span>
        </a>

        <a class="game-tile" href="Games/Drehrad/index.html" id="drehradTile" aria-label="Drehrad öffnen">
          <div class="game-logo-wrap">
            <img class="game-logo" src="Assets/Logo/Drehrad_Logo.png" alt="" />
          </div>
          <span class="game-name">Drehrad</span>
        </a>

        <a class="game-tile" href="Games/Mystery%20Cards/index.html" id="mysteryCardsTile" aria-label="Mystery Cards öffnen">
          <div class="game-logo-wrap">
            <img class="game-logo" src="Assets/Logo/Mystery_Cards_Logo.png" alt="" />
          </div>
          <span class="game-name">Mystery Cards</span>
        </a>


        <a class="game-tile" href="Games/2%20Dumme%201%20Gedanke/index.html" id="zweiDummeEinGedankeTile" aria-label="2 Dumme 1 Gedanke öffnen">
          <div class="game-logo-wrap">
            <img class="game-logo" src="Assets/Logo/2Dumme_1Gedanke_Logo.png" alt="" />
          </div>
          <span class="game-name">2 Dumme 1 Gedanke</span>
        </a>

      </div>
    </section>
  </main>
  <script src="hub.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
