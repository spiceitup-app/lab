<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#00198c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Spice it up! Lab" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <title>Word Quicky</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="apple-touch-icon" sizes="180x180" href="../Assets/app-icon-180.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="../Assets/favicon-32.png" />
</head>
<body>
  <main class="app-shell">
    <div class="game-header-bg" aria-hidden="true">
      <img class="game-header-shape" src="Assets/game_header.svg" alt="" />
    </div>

    <header class="topbar">
      <button class="icon-button" id="backToGamesButton" type="button" aria-label="Zurück zu Spiele">
        <img src="Assets/back.svg" alt="" />
      </button>
      <h1>Word Quicky</h1>
      <button class="icon-button" id="settingsButton" type="button" aria-label="Einstellungen öffnen">
        <img src="Assets/header_gamemenu.svg" alt="" />
      </button>
    </header>

    <section class="game-stage" aria-live="polite">
      <div class="card-stack" id="cardStack">
        <div class="preview-card" id="previewCard" aria-hidden="true">
          <div class="card-back preview-card-back">
            <div class="prompt-panel preview-prompt"><span id="previewPromptText"></span></div>
            <div class="result-panel preview-result">
              <div class="result-copy">
                <span class="result-prefix">Der Gewinner verteilt</span>
                <strong id="previewResultAmount"></strong>
              </div>
            </div>
          </div>
        </div>

        <button class="game-card" id="gameCard" type="button" aria-label="Spiel starten">
          <div class="card-inner" id="cardInner">
            <div class="card-face card-front">
              <img src="Assets/card_background.png" alt="Chili" />
            </div>
            <div class="card-face card-back">
              <div class="prompt-panel"><span id="promptText">Spicy Intensity</span></div>
              <div class="result-panel">
                <div class="result-copy">
                  <span class="result-prefix">Der Gewinner verteilt</span>
                  <strong id="resultAmount">2 Strafschlücke</strong>
                </div>
              </div>
            </div>
          </div>
        </button>
      </div>

      <div class="instruction-row">
        <img src="Assets/game_instructions.svg" alt="" />
        <span id="instructionText">Zum Start tippen</span>
      </div>
    </section>
  </main>

  <div class="sheet-scrim" id="sheetScrim" hidden></div>
  <section class="settings-sheet" id="settingsSheet" aria-hidden="true" aria-label="Spiel-Einstellungen">
    <div class="sheet-scroll">
      <div class="setting-card">
        <div class="setting-title-row">
          <img src="Assets/Intensity_Spicy.svg" alt="" />
          <h2>Spicy Intensity</h2>
        </div>
        <div class="level-grid" id="spicyLevels"></div>
        <div class="setting-summary" id="spicySummary">
          <strong>Soft</strong>
          <span>Null intime &amp; sensible Inhalte</span>
        </div>
      </div>

      <div class="setting-card">
        <div class="setting-title-row">
          <img src="Assets/Intensity_Suff.svg" alt="" />
          <h2>Suff Intensity</h2>
        </div>
        <div class="level-grid" id="suffLevels"></div>
        <div class="setting-summary" id="suffSummary">
          <strong>Chillig</strong>
          <span>0 Strafschlücke</span>
        </div>
      </div>

      <div class="setting-card experimental-setting-card">
        <label class="experimental-toggle">
          <span class="toggle-copy">
            <strong>Experimentelle Suff Intensity</strong>
            <span>Alternative Wahrscheinlichkeiten verwenden</span>
          </span>
          <input id="experimentalSuffToggle" type="checkbox" />
          <span class="toggle-control" aria-hidden="true"></span>
        </label>
      </div>
    </div>

    <button class="done-button" id="doneButton" type="button">Fertig</button>
  </section>

  <script src="content/spicy-level-1.js"></script>
  <script src="content/spicy-level-2.js"></script>
  <script src="content/spicy-level-3.js"></script>
  <script src="content/suff-normal.js"></script>
  <script src="content/suff-experimental.js"></script>
  <script src="app.js"></script>
</body>
</html>
